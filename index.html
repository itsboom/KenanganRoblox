<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Our Roblox Memories — a tiny digital scrapbook made for our Roblox friendship."
    >

    <title>Our Roblox Memories 🎮</title>

    <!-- Google Fonts: maximum 2 fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =====================================================
         DECORATIVE FLOATING ELEMENTS
    ====================================================== -->
    <div class="floating-decorations" aria-hidden="true">
        <span class="float-item float-1">✦</span>
        <span class="float-item float-2">♡</span>
        <span class="float-item float-3">✧</span>
        <span class="float-item float-4">⭐</span>
        <span class="float-item float-5">✨</span>
        <span class="float-item float-6">🎮</span>
        <span class="float-item float-7">♡</span>
    </div>


    <!-- =====================================================
         OPENING SCREEN
         This IS the whole page now — no JS toggle involved,
         so it always shows correctly no matter how you land
         here (fresh visit, "Kembali ke Home" from gallery.html,
         back/forward button, etc).
    ====================================================== -->
    <div class="opening-screen" id="openingScreen">

        <div class="opening-stars" aria-hidden="true">
            <span>✦</span>
            <span>✧</span>
            <span>⋆</span>
            <span>✦</span>
            <span>♡</span>
            <span>✧</span>
        </div>

        <div class="opening-content">

            <div class="opening-game-icon" aria-hidden="true">
                🎮
            </div>

            <p class="opening-small">
                A tiny corner of the internet...
            </p>

            <h1>
                Hey, you... 👀
            </h1>

            <p class="opening-subtitle">
                There's something I want you to see.
            </p>

            <a
                href="pages/home.html"
                class="primary-button opening-button"
                id="openMemoriesBtn"
            >
                Open Our Memories 🎮
            </a>

            <p class="opening-note">
                best opened with a little nostalgia ♡
            </p>

        </div>
    </div>

</body>
</html>
